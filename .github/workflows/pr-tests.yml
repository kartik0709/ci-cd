# This is a basic workflow to help you get started with Actions

name: PR Tests (from Dev branches)

# Controls when the workflow will run
on:
  # Triggers the workflow on pull request events but only for the "main" branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Xano CLI profile
        env:
          XANO_AUTH: ${{ secrets.XANO_AUTH }}
        run: |
          npx -y @xano/cli profile create ci \
            -i "https://xhqc-feze-bomo.dev.xano.io" \
            -t "$XANO_AUTH" \
            -w 94 \
            -b v1 \
            --default
            
      - name: Sanitize branch name
        id: sanitize
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          SAFE=$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')
          echo "branch=$SAFE" >> "$GITHUB_OUTPUT"
          
      - name: Ensure Xano branch exists
        run: |
          BRANCH="${{ steps.sanitize.outputs.branch }}"
          if npx -y @xano/cli branch get "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH already exists"
          else
            npx -y @xano/cli branch create "$BRANCH" --source v1 -d "Auto-created from GitHub branch ${{ github.head_ref || github.ref_name }}"
          fi
          
      - name: Push to feature branch
        run: npx -y @xano/cli workspace push --sync --delete --force --branch "${{ steps.sanitize.outputs.branch }}"

      - name: Run unit tests on feature branch
        run: npx -y @xano/cli unit_test run_all --branch "${{ steps.sanitize.outputs.branch }}"

