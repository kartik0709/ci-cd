# This is a basic workflow to help you get started with Actions

name: Deploy to staging tenant

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "deploy to staging"
    deploy_to_staging:

        # The type of runner that the job will run on
        runs-on: ubuntu-latest

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: "24"
        
        - name: Fetch all tags
          run: git fetch --tags --force


        - name: Create the new release tag
          id: tag
          run: |
            INPUT_VERSION="${{ inputs.version }}" 
            if [ -n "$INPUT_VERSION" ]; then
                VERSION="$INPUT_VERSION"
                echo "Using explicitly requested version: $VERSION"
            else
                LATEST_TAG=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
                if [ -z "$LATEST_TAG" ]; then
                LATEST_TAG="0.0.0"
                fi
                IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
                PATCH=$((PATCH + 1))
                VERSION="$MAJOR.$MINOR.$PATCH"
                echo "Latest tag: $LATEST_TAG  ->  New version: $VERSION"
            fi
 
            if git rev-parse "$VERSION" >/dev/null 2>&1; then
                echo "Tag $VERSION already exists, skipping tag creation"
            else
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$VERSION" -m "Release $VERSION"
                git push origin "$VERSION"
            fi
 
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        - name: Configure Xano CLI profile
          env:
            XANO_AUTH: ${{ secrets.XANO_AUTH }}
          run: |
            npx -y @xano/cli profile create ci \
                -i "https://xhqc-feze-bomo.dev.xano.io" \
                -t "$XANO_AUTH" \
                -w 96 \
                -b v1 \
                --default

        - name: Create release branch
          run: npx -y @xano/cli branch create release_"${{ steps.tag.outputs.version }}" --source v1 -d "new release"

        - name: Push to release branch
          run: npx -y @xano/cli workspace push --sync --delete --force --branch release_"${{ steps.tag.outputs.version }}" 

        - name: Run unit tests on release branch
          run: npx -y @xano/cli unit_test run_all --branch release_"${{ steps.tag.outputs.version }}" 

        - name: Create a new release for tenant
          run: npx -y @xano/cli release create v"${{ steps.tag.outputs.version }}" --branch release_"${{ steps.tag.outputs.version }}" 

        - name: Deploy to tenant
          run: npx -y @xano/cli tenant deploy_release t2an-8vw9-8d2f -r v"${{ steps.tag.outputs.version }}"


        